<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Global Reunion">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <meta name="theme-color" content="#286AD8">
  <title>Global Reunion · Cruise Edition</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preload" href="/anton.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Accesso / registrazione -->
  <section id="login" class="screen hidden">
    <div class="login-wrap">
      <div class="brand">
        <img class="brand-logo" src="/wordmark.png" alt="WeRoad Global Reunion, Cruise Edition" width="582" height="180">
        <p class="brand-sub">The private chat for participants</p>
      </div>
      <div class="login-card">
        <form id="login-form">
          <div class="field-row">
            <div class="field">
              <label for="first-name">First name</label>
              <input id="first-name" autocomplete="given-name" maxlength="40" required>
            </div>
            <div class="field">
              <label for="last-name">Last name</label>
              <input id="last-name" autocomplete="family-name" maxlength="40" required>
            </div>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="email" inputmode="email" maxlength="120" placeholder="the one you booked the trip with" required>
          </div>
          <div id="join-code-field" class="field hidden">
            <label for="join-code">Event code</label>
            <input id="join-code" autocapitalize="characters" spellcheck="false" maxlength="20">
          </div>
          <button type="submit">Join the chat</button>
          <p id="login-error" class="error" role="alert"></p>
          <p class="hint">First time? You'll be signed up automatically. To sign in on another phone, use the same email and last name.</p>
        </form>
      </div>
      <button type="button" id="home-guide-link" class="home-link">📲 How to add the chat to your Home Screen</button>
    </div>
  </section>

  <!-- App -->
  <section id="app" class="screen hidden">
    <aside id="sidebar">
      <header class="bar">
        <img class="bar-logo" src="/wordmark.png" alt="Global Reunion, Cruise Edition" width="582" height="180">
        <div class="bar-actions">
          <span id="me-avatar" class="avatar"></span>
          <button id="btn-new" class="icon" title="New chat" aria-label="New chat"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 8v5M9.5 10.5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
          <button id="btn-menu" class="icon" title="Menu" aria-label="Menu"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="5" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="19" r="2" fill="currentColor"/></svg></button>
        </div>
      </header>
      <div class="waves-strip" aria-hidden="true"></div>
      <div id="offline" class="offline hidden">No connection, retrying…</div>
      <div class="search"><input id="conv-filter" type="search" placeholder="Search chats" aria-label="Search chats"></div>
      <div id="tabs" class="tabs" role="tablist">
        <button type="button" data-tab="all" class="on">All</button>
        <button type="button" data-tab="unread">Unread</button>
        <button type="button" data-tab="groups">Groups</button>
        <button type="button" data-tab="dm">Private</button>
      </div>
      <div id="push-card" class="push-card hidden"></div>
      <ul id="conv-list" class="list"></ul>
      <button id="fab-new" class="fab" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
        New chat
      </button>
    </aside>

    <main id="chat">
      <div id="chat-empty" class="chat-empty-wrap">
       <div class="chat-empty">
        <img class="empty-logo" src="/wordmark.png" alt="Global Reunion, Cruise Edition" width="582" height="180">
        <p>Pick a chat on the left or tap “New chat”</p>
       </div>
       <div class="waves-band" aria-hidden="true"></div>
      </div>
      <div id="chat-view" class="hidden">
        <header class="bar">
          <button id="btn-back" class="icon back" aria-label="Back"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button id="chat-title-btn" class="chat-title">
            <span id="chat-avatar" class="avatar"></span>
            <span>
              <span id="chat-title"></span>
              <small id="chat-subtitle" class="muted"></small>
            </span>
          </button>
        </header>
        <div class="waves-strip" aria-hidden="true"></div>
        <div id="messages" class="messages"></div>
        <button id="to-bottom" class="to-bottom hidden" type="button" aria-label="Jump to latest messages">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="to-bottom-n" class="n hidden"></span>
        </button>
        <form id="composer" class="composer">
          <textarea id="msg-input" rows="1" maxlength="1000" placeholder="Write a message"></textarea>
          <button id="send-btn" type="submit" aria-label="Send"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 12l16-8-6 16-2.5-6.5z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
        </form>
        <div id="readonly-note" class="readonly hidden">📢 Only organisers can post here</div>
      </div>
    </main>
  </section>

  <!-- Finestra modale generica -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <header class="modal-head">
        <h2 id="modal-title"></h2>
        <button id="modal-close" class="icon" aria-label="Close"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
      </header>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/app.js"></script>
</body>
</html>

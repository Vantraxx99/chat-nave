# Deploy su Render (https://render.com): New → Blueprint → scegli questo repository.
# Piano Starter + disco persistente per il periodo delle iscrizioni; qualche giorno prima della
# crociera passate a "standard" (più CPU per 2000–3000 persone collegate insieme).
# Il disco tiene database e chiavi delle notifiche: senza, tutto si perde a ogni riavvio.
services:
  - type: web
    name: global-reunion-chat
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: chat-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAILS
        sync: false
      # Codice di verifica via email alla registrazione (vedi README): una delle due chiavi + mittente
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
